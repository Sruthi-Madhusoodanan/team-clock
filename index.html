<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Clock</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        h1 {
            margin-bottom: 2rem;
            font-size: 2rem;
            color: #00d4ff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-4px); }
        .card .name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .card .tz {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.8rem;
        }
        .card .time {
            font-size: 1.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #00d4ff;
        }
        .card .date {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 0.4rem;
        }
    </style>
</head>
<body>
    <h1>🌍 Team Clock</h1>
    <div class="grid" id="grid"></div>

    <script>
        // ─── Configure your 8 team members here ─────────────────────────
        const team = [
            { name: "Ha",  timezone: "Asia/Ho_Chi_Minh" },
            { name: "Joel",    timezone: "Australia/Melbourne" },
            { name: "Lennox", timezone: "Africa/Accra" },
            { name: "Mahesvaran",  timezone: "Asia/Kolkata" },
            { name: "Nicole",   timezone: "Asia/Kuala_Lumpur" },
            { name: "Prabhu", timezone: "Asia/Kolkata" },
            { name: "Sreng",   timezone: "Asia/Phnom_Penh" },
            { name: "Sruthi",   timezone: "Asia/Kolkata" }
        ];
        // ─────────────────────────────────────────────────────────────────

        function updateClocks() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (const member of team) {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-US', {
                    timeZone: member.timezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
                const dateStr = now.toLocaleDateString('en-US', {
                    timeZone: member.timezone,
                    weekday: 'short',
                    month: 'short',
                    day: 'numeric'
                });
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('role', 'region');
                card.setAttribute('aria-label', member.name + ' local time');
                card.innerHTML = `
                    <div class="name">${member.name}</div>
                    <div class="tz">${member.timezone}</div>
                    <div class="time" aria-live="polite">${timeStr}</div>
                    <div class="date">${dateStr}</div>
                `;
                grid.appendChild(card);
            }
        }

        updateClocks();
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
